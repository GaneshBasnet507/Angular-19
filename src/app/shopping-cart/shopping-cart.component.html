
<button class="add-book" [ngClass]="'add-book'" (click)="toggleAddBookForm()">
  Add Book
</button>

<table  class="table">
  <thead>
     <tr > 
      <th>iD</th>
      <th>total_amount</th>
      <th>user_id</th>
      <th>title</th>
      <th>Remove</th>
      <th>Clear</th>
  </tr>
  </thead>
    <tbody>
      <tr>
        <tr *ngFor="let Cart of carts ">
          <td>{{ Cart.id }}</td>
          <td>{{ Cart.total_amount }}</td>
          <td>{{ Cart.user_id }} </td>
          <td>{{ Cart.title }} </td>
          <!-- <td>{{ Book.quantity }}</td> -->
          <td>
            <button (click)="onRemove(Cart.title)">Remove-Book</button>
          </td>
          <!-- <td>
            <button (click)="onClear(Book.title)">Clear</button>
          </td> -->
        </tr>
      </tbody>
  </table>
<div *ngIf="showAddBookForm">

  <form class="add-book"#addBook="ngForm" (ngSubmit)="onAddBook(addBook)"> 
    <label for="title">title:</label>
    <input id="title" [(ngModel)]="Book.title" name="title" required /> <br>
